; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:seeed_wio_terminal]
platform = atmelsam
board = seeed_wio_terminal
framework = arduino
; The platform's default toolchain is GCC 7.2 (2017), which tops out at C++17.
; GCC 14.2 supports C++23.
platform_packages = platformio/toolchain-gccarmnoneeabi@~1.140201.0
lib_deps =
    https://github.com/lovyan03/LovyanGFX.git
    https://github.com/sparkfun/SparkFun_Qwiic_Twist_Arduino_Library.git
    https://github.com/ETLCPP/etl.git#20.49.0
    https://github.com/br3ttb/Arduino-PID-Library.git
; Bundled with the framework package and auto-linked by the LDF even though
; nothing here uses it, but its own sysTickHook() collides with ours (see
; main.cpp) - not needed since this project doesn't use FreeRTOS. Declared
; library name has spaces (library.properties), not the folder name.
lib_ignore = Seeed Arduino FreeRTOS
; LGFX_AUTODETECT pulls in LovyanGFX's platform-specific board detection
; (src/lgfx/v1_autodetect/LGFX_AutoDetect_SAMD51.hpp), which probes for and
; configures this exact board (SERCOM7, ILI9341, the WIO Terminal's
; CCL/EVSYS-routed backlight PWM) automatically. Needed because PlatformIO's
; board definition for seeed_wio_terminal doesn't define ARDUINO_WIO_TERMINAL
; (only WIO_TERMINAL/SEEED_WIO_TERMINAL), which is what the autodetect header
; normally keys off - LGFX_WIO_TERMINAL is the documented workaround.
;
; C++23 instead of the platform's default gnu++11, and standard C++ rather
; than the GNU dialect. SCons routes -std=c++* to C++ compiles only, so the
; core's C files keep their own -std=gnu11. C++23 rather than C++20 also
; because C++20 deprecated compound assignment on volatile (REG |= bit, all
; over CMSIS/core register code), and C++23 un-deprecated it again.
build_unflags = -std=gnu++11
build_flags =
    -std=c++23
    -D LGFX_AUTODETECT
    -D LGFX_WIO_TERMINAL
