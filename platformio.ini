; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:seeed_wio_terminal]
platform = atmelsam
board = seeed_wio_terminal
framework = arduino
lib_deps =
    https://github.com/Seeed-Studio/Seeed_Arduino_LCD.git
    https://github.com/Seeed-Studio/Seeed_Arduino_FS.git
    https://github.com/sparkfun/SparkFun_Qwiic_Twist_Arduino_Library.git
    https://github.com/ETLCPP/etl.git
; Bundled with the framework package and auto-linked by the LDF even though
; nothing here uses it, but its own sysTickHook() collides with ours (see
; main.cpp) - not needed since this project doesn't use FreeRTOS. Declared
; library name has spaces (library.properties), not the folder name.
lib_ignore = Seeed Arduino FreeRTOS
